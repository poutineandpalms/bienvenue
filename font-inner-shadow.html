<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inner Text Shadow Techniques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0f1a; color: #fff; font-family: system-ui, sans-serif; }
  .intro { max-width: 900px; margin: 0 auto; padding: 48px 24px 24px; text-align: center; }
  .intro h1 { font-size: 28px; margin-bottom: 12px; }
  .intro p { color: rgba(255,255,255,.7); font-size: 16px; line-height: 1.6; }
  .opt { margin: 32px auto; max-width: 1100px; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,.5); }
  .lbl { background: #111827; padding: 16px 24px; }
  .lbl .name { font-size: 18px; font-weight: 700; }
  .lbl .desc { color: rgba(255,255,255,.55); font-size: 14px; margin-top: 4px; }
  .mock { position: relative; aspect-ratio: 16/8; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px; }
  .mock::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,.38) 0%, rgba(0,0,0,0) 60%); }
  .names { position: relative; z-index: 1; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: clamp(48px, 7vw, 96px); line-height: 1.1; }
  /* 1: current - subtle vertical gradient */
  .t1 .names { background: linear-gradient(to bottom, #fff 55%, rgba(255,255,255,.82) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  /* 2: letterpress embossed */
  .t2 .names { color: #fff; text-shadow: 0 -1px 1px rgba(0,0,0,.45), 0 1px 1px rgba(255,255,255,.15); }
  /* 3: debossed / carved */
  .t3 .names { color: rgba(255,255,255,.92); text-shadow: 0 1px 2px rgba(0,0,0,.6), 0 -1px 0 rgba(255,255,255,.12); }
  /* 4: strong gradient depth */
  .t4 .names { background: linear-gradient(to bottom, #ffffff 30%, #d4d4d4 70%, #a8a8a8 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  /* 5: SVG true inner shadow */
  .t5 .names { color: #fff; filter: url(#innershadow); }
  /* 6: inner glow top */
  .t6 .names { background: linear-gradient(to bottom, rgba(255,255,255,.35) 0%, #fff 25%, #fff 75%, rgba(0,0,0,.25) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  /* 7: soft embossed with blur */
  .t7 .names { color: #f5f5f5; text-shadow: 0 2px 3px rgba(0,0,0,.5), 0 -1px 1px rgba(255,255,255,.2); }
  .footer { text-align: center; padding: 32px; color: rgba(255,255,255,.5); font-size: 14px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="innershadow" x="-20%" y="-20%" width="140%" height="140%">
      <feComponentTransfer in="SourceAlpha"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
      <feGaussianBlur stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feFlood flood-color="rgb(0,0,0)" result="color"/>
      <feComposite in2="offsetblur" operator="in" result="shadow"/>
      <feComposite in2="SourceAlpha" operator="in" result="shadowclipped"/>
      <feComposite in="SourceGraphic" in2="shadowclipped" operator="over"/>
    </filter>
  </defs>
</svg>
<div class="intro">
  <h1>Inner Text Shadow — Techniques</h1>
  <p>Different ways to create depth <em>inside</em> the letterforms.<br>Pick the one that feels right!</p>
</div>
<div id="opts"></div>
<div class="footer">Inner shadow techniques for Bienvenue welcome text</div>
<script>
var techs = [
  { cls: 't1', name: '1. Subtle vertical gradient (current)', desc: 'White to slightly dimmed — what\'s on the TV now' },
  { cls: 't2', name: '2. Letterpress embossed', desc: 'Light below, dark above — raised feel' },
  { cls: 't3', name: '3. Debossed / carved', desc: 'Dark below, light above — inset feel' },
  { cls: 't4', name: '4. Strong gradient depth', desc: 'More dramatic top-to-bottom shading' },
  { cls: 't5', name: '5. SVG true inner shadow', desc: 'Real inner shadow via SVG filter' },
  { cls: 't6', name: '6. Inner glow', desc: 'Bright center fading to darker edges' },
  { cls: 't7', name: '7. Soft embossed', desc: 'Blurred depth, subtle and soft' },
];
var bg = 'assets/heroes/community.webp';
var html = '';
techs.forEach(function(t) {
  html += '<div class="opt ' + t.cls + '">'
    + '<div class="lbl"><div class="name">' + t.name + '</div><div class="desc">' + t.desc + '</div></div>'
    + '<div class="mock" style="background-image:url(' + bg + ')">'
    + '<div class="names">Gen, Kevin &amp; William</div>'
    + '</div></div>';
});
document.getElementById('opts').innerHTML = html;
</script>
</body>
</html>
