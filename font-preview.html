<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bienvenue — Font Options Round 2 (Sans-Serif Personality)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=chillax@600,700&f[]=cabinet-grotesk@700,800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Unbounded:wght@700;800&family=Bungee&family=Titan+One&family=Righteous&family=Bowlby+One&family=Dela+Gothic+One&family=Baloo+2:wght@800&family=Chivo:wght@900&family=Sora:wght@800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0f1a; color: #fff; font-family: system-ui, sans-serif; }
  .intro { max-width: 900px; margin: 0 auto; padding: 48px 24px 24px; text-align: center; }
  .intro h1 { font-size: 28px; margin-bottom: 12px; }
  .intro p { color: rgba(255,255,255,.7); font-size: 16px; line-height: 1.6; }
  .font-option { margin: 32px auto; max-width: 1100px; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,.5); }
  .font-label { background: #111827; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
  .font-label .name { font-size: 18px; font-weight: 700; }
  .font-label .num { color: rgba(255,255,255,.5); font-size: 14px; }
  .mock { position: relative; aspect-ratio: 16/9; background-size: cover; background-position: center; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; }
  .mock::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,.25) 0%, rgba(0,0,0,.55) 100%); }
  .mock > * { position: relative; z-index: 1; }
  .eyebrow { font-size: 14px; letter-spacing: .42em; text-transform: uppercase; font-weight: 600; text-shadow: 0 1px 10px rgba(0,0,0,.55); margin-bottom: 16px; font-family: system-ui, sans-serif; }
  .names { font-size: clamp(40px, 6vw, 84px); font-weight: 800; line-height: 1.12; text-shadow: 0 2px 26px rgba(0,0,0,.5); margin-bottom: 12px; }
  .msg { font-size: 17px; font-weight: 300; color: rgba(255,255,255,.93); text-shadow: 0 1px 8px rgba(0,0,0,.5); font-family: system-ui, sans-serif; }
  .f-fraunces .names { font-family: 'Fraunces', serif; font-weight: 900; }
  .f-clash .names { font-family: 'Clash Display', sans-serif; font-weight: 700; }
  .f-bricolage .names { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; }
  .f-unbounded .names { font-family: 'Unbounded', sans-serif; font-weight: 800; }
  .f-bungee .names { font-family: 'Bungee', sans-serif; }
  .f-titan .names { font-family: 'Titan One', sans-serif; }
  .f-chillax .names { font-family: 'Chillax', sans-serif; font-weight: 700; }
  .f-cabinet .names { font-family: 'Cabinet Grotesk', sans-serif; font-weight: 800; }
  .f-righteous .names { font-family: 'Righteous', sans-serif; }
  .f-bowlby .names { font-family: 'Bowlby One', sans-serif; }
  .f-dela .names { font-family: 'Dela Gothic One', sans-serif; }
  .f-baloo .names { font-family: 'Baloo 2', sans-serif; font-weight: 800; }
  .f-chivo .names { font-family: 'Chivo', sans-serif; font-weight: 900; }
  .f-sora .names { font-family: 'Sora', sans-serif; font-weight: 800; }
  .f-spacegrot .names { font-family: 'Space Grotesk', sans-serif; font-weight: 700; }
  .footer { text-align: center; padding: 32px; color: rgba(255,255,255,.5); font-size: 14px; }
</style>
</head>
<body>
<div class="intro">
  <h1>Font Options — Round 2</h1>
  <p>Bold sans-serifs with personality. No serifs, no pointy bits.<br>Quirky, trendy, fun — pick your brand!</p>
</div>
<div id="options"></div>
<div class="footer">Bienvenue font preview round 2</div>
<script>
var fonts = [
  { cls: 'f-fraunces', name: 'Fraunces Black (your pick — reference)', desc: 'The one you liked' },
  { cls: 'f-clash', name: 'Clash Display', desc: 'Trendy, bold, modern' },
  { cls: 'f-bricolage', name: 'Bricolage Grotesque', desc: 'Quirky grotesque, lots of character' },
  { cls: 'f-unbounded', name: 'Unbounded', desc: 'Wide, distinctive, very trendy' },
  { cls: 'f-bungee', name: 'Bungee', desc: 'In-your-face bold, playful' },
  { cls: 'f-titan', name: 'Titan One', desc: 'Chunky, fun, friendly' },
  { cls: 'f-chillax', name: 'Chillax', desc: 'Quirky sans, modern cool' },
  { cls: 'f-cabinet', name: 'Cabinet Grotesk', desc: 'Sharp modern grotesque' },
  { cls: 'f-righteous', name: 'Righteous', desc: 'Geometric, fun, distinctive' },
  { cls: 'f-bowlby', name: 'Bowlby One', desc: 'Bold condensed, punchy' },
  { cls: 'f-dela', name: 'Dela Gothic One', desc: 'Heavy, bold, trendy' },
  { cls: 'f-baloo', name: 'Baloo 2', desc: 'Rounded, friendly, bold' },
  { cls: 'f-chivo', name: 'Chivo Black', desc: 'Strong grotesque, no nonsense' },
  { cls: 'f-sora', name: 'Sora ExtraBold', desc: 'Geometric with character' },
  { cls: 'f-spacegrot', name: 'Space Grotesk', desc: 'Techy, distinctive' },
];
var bg = 'assets/heroes/community.webp';
var html = '';
fonts.forEach(function(f, i) {
  html += '<div class="font-option ' + f.cls + '">'
    + '<div class="font-label"><span class="name">' + (i+1) + '. ' + f.name + '</span><span class="num">' + f.desc + '</span></div>'
    + '<div class="mock" style="background-image:url(' + bg + ')">'
    + '<div class="eyebrow">Good evening</div>'
    + '<div class="names">Gen, Kevin &amp; William</div>'
    + '<div class="msg">Make yourselves at home — everything you need is right here.</div>'
    + '</div></div>';
});
document.getElementById('options').innerHTML = html;
</script>
</body>
</html>
